name: reader-native-source
on:
  push:
    branches: [cowork/reader-linux-native-harness, cowork/reader-native-wrapper, cowork/reader-hosted-reopened-mounts]
    paths:
      - scripts/guest-reader-native/**
      - test/guest/reader-harness-consumer.test.ts
      - .github/workflows/cowork-reader-native-source.yml
      - test/gates/release-gates.test.ts
  pull_request:
    paths:
      - scripts/guest-reader-native/**
      - test/guest/reader-harness-consumer.test.ts
      - .github/workflows/cowork-reader-native-source.yml
      - test/gates/release-gates.test.ts
permissions:
  contents: read
jobs:
  portable-data:
    if: github.event_name == 'push' || github.head_ref == 'cowork/reader-linux-native-harness' || github.head_ref == 'cowork/reader-native-wrapper' || github.head_ref == 'cowork/reader-hosted-reopened-mounts'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Injected lifetime and temporary data checks
        run: python3 -I -S -B -m unittest discover -s scripts/guest-reader-native -p 'test_*.py'
