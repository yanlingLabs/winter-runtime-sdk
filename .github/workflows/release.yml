name: release
# Cloned from the SDK repository's own `release.yml` and reduced to one package, at the repo root.
#
# NOTHING HAS EVER RUN THIS WORKFLOW TO COMPLETION. The first publish is the user's decision (R-7b-5,
# Phase 8a Task 0 Step 4): it happens when a `v0.0.1` tag is pushed, and not before.
# `test/gates/release-gates.test.ts` parses this file and asserts the trigger set below is EXACTLY
# `v*` + `workflow_dispatch` — no `phase-*` tag, no `push: branches` — and that no other workflow in
# this repository contains the word `publish`.
#
# ONE CHECKOUT. The three `@yanlinglabs/*` devDependencies are registry pins (`^0.0.2`, on npm) as of
# Phase 8a Task 0 Step 1, so the sibling-checkout shape `ci.yml` still carries is not needed here:
# `pnpm install --frozen-lockfile` resolves them from npm, and `scripts/build-packages.ts` finds the
# peer's declarations in the installed dist-only package rather than in a sibling's `dist`.
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}
jobs:
  # --- TWO REGISTRIES, TWO JOBS ---------------------------------------------------------------------
  #
  # GitHub Packages first, npm second, SEPARATE jobs on purpose: the npm leg needs a secret this
  # repository may not have, and a missing `NPM_TOKEN` must never block the GitHub Packages publish.
  # `needs:` makes the dependency explicit — npm runs only if GitHub Packages SUCCEEDED, so the two
  # registries can never disagree about which versions exist because the first leg failed halfway.
  publish:
    runs-on: ubuntu-latest
    # `packages: write` is the one elevated grant a publish needs and the only reason this job's token
    # differs from every job in `ci.yml`.
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.3.14" }
      - uses: pnpm/action-setup@v4
        with: { version: 10 }

      # INSTALL BEFORE THE REGISTRY PIN — the one ordering this repository must get right and the SDK
      # repository never had to. `actions/setup-node` below writes `@yanlinglabs:registry=<url>` into
      # a throwaway userconfig, and from that step on EVERY pnpm/npm resolution of the scope goes to
      # that registry. This package's own `@yanlinglabs/*` devDependencies are registry pins resolved
      # from npm (the lockfile's integrity hashes are npm's), and this step carries no credential —
      # so an install placed after the pin would ask GitHub Packages for them, unauthenticated, and
      # fail. Installed here, before the pin exists, it resolves from npm exactly as `ci.yml` does.
      # The runner's preinstalled Node is enough for pnpm; the Node 18 the smokes need comes next.
      - run: pnpm install --frozen-lockfile

      # `registry-url` + `scope` make setup-node write a throwaway userconfig (`$RUNNER_TEMP/.npmrc`,
      # pointed at by `NPM_CONFIG_USERCONFIG`) carrying BOTH `@yanlinglabs:registry=<url>` and
      # `//<url>/:_authToken=${NODE_AUTH_TOKEN}` — one mechanism choosing the registry and the
      # credential together, per job. That is why the committed `.npmrc` pins neither: a committed pin
      # is global, and there are two registries. Nothing after this step installs anything: the pin
      # governs `check-already-published.ts` and `pnpm publish`, which is all it is for.
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          registry-url: "https://npm.pkg.github.com"
          scope: "@yanlinglabs"

      # --- the gates: the same sequence ci.yml runs on every push, repeated here so a tag pushed out
      # of step with CI history (or a `workflow_dispatch` on an arbitrary ref) is never published
      # unverified. Kept in sync by hand, matching the SDK repository's own convention. ---
      - run: bun run build:packages
      - run: bun test
      - run: bun run typecheck
      - run: bun run scripts/smoke-installed.ts --runtime=node   # BLOCKING
      - run: bun run scripts/smoke-installed.ts --runtime=bun    # BLOCKING

      # THE VERSION/TAG CONSISTENCY GATE. A publish is triggered by pushing `v<version>` and what
      # ships is whatever the manifest says at that commit — equal only because a human ran the bump
      # before tagging. Diverging does not fail the publish, it SUCCEEDS at publishing the wrong
      # number, to registries where a version can never be re-published.
      - run: bun run scripts/check-release-version.ts

      # Built AGAIN immediately before the publish: several steps run in between, and the bytes that
      # SHIP must be built by a step adjacent to the one that publishes them. Relying on an earlier
      # step's leftovers is a dependency nothing states and nothing checks, and the failure mode is
      # silent — a `default` condition naming a file that is simply absent from the tarball.
      - run: bun run build:packages
      # IDEMPOTENT RE-DRIVE, stated out loud: a half-done release is finished by a `workflow_dispatch`
      # at the SAME tag, never by a version bump, and the log says whether this registry already had
      # the version. `pnpm publish` itself refuses a duplicate; this step is the explanation.
      - name: "report whether this registry already has this version"
        run: bun run scripts/check-already-published.ts --registry https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # `--no-git-checks` because the tag ref is a detached HEAD. pnpm (not npm) is what applies the
      # dist-only `publishConfig.exports` override at pack time — the `prepack` guard in package.json
      # refuses a non-pnpm pack for exactly that reason. `publishConfig.access` is `restricted`, which
      # is GitHub Packages' setting; the npm leg passes `--access public` explicitly.
      - run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --- THE npm LEG ----------------------------------------------------------------------------------
  #
  # `needs: publish` — it runs only after GitHub Packages succeeded, so a half-published pair is not
  # possible in the direction that matters (npm is the registry a version can never be taken back
  # from). A missing `NPM_TOKEN` SKIPS this job's publish step and leaves the GitHub Packages publish
  # untouched, which is why this is a separate job rather than two steps in one.
  #
  # NOTHING IN THIS JOB POINTS AT GITHUB PACKAGES. The SDK repository's history is the warning: a
  # committed scope pin (or a `publishConfig.registry`) beats `--registry` at both the pnpm and the
  # npm layer, and nothing reached npm. This job's only registry pin is the `setup-node` one below,
  # bound to npmjs for this job alone; `package.json` carries no `publishConfig.registry`.
  #
  # `--provenance` attaches a signed npm provenance statement, which is why this job — and only this
  # job — carries `id-token: write`. `scripts/publish-npm.ts` packs through `releasePack()` (pnpm, so
  # the dist-only overrides apply) and publishes the resulting TARBALL with `npm publish --provenance
  # --access public`, which is the only combination that gets both the overrides and provenance
  # (pnpm's own publish rebuilds npm's argv and silently drops `--provenance`).
  #
  # RUNBOOK when this job fails after job 1 succeeded:
  #   1. DO NOT bump the version. Both registries refuse a version they already hold, so a bump would
  #      leave the tag naming something other than what shipped. Re-drive instead: `workflow_dispatch`
  #      at the SAME tag ref. Both jobs skip what their own registry already has.
  #   2. `NPM_TOKEN` must exist BEFORE the tag is pushed. Without it this job's publish step is
  #      SKIPPED and the workflow goes green with GitHub Packages published and npm empty.
  #   3. NEVER pack or publish this package with plain `npm` by hand — see the `prepack` guard.
  publish-npm:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.3.14" }
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      # Same ordering as job 1, for the same reason: the install resolves from npm before any scope
      # pin exists. Here the pin happens to name npm too, so the order is a convention kept rather
      # than a failure avoided — the two jobs stay the same shape.
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          scope: "@yanlinglabs"
      # The same two gates the GitHub Packages job ran, repeated here because this job checks out
      # afresh: the version/tag agreement, and the compiled emit the tarball must contain.
      - run: bun run scripts/check-release-version.ts
      - run: bun run build:packages
      # TOKEN-GATED. `if:` cannot read `secrets` in a job-level condition, so the secret is lifted into
      # `env` on the step and the condition tests THAT. With no token the step is SKIPPED (green), the
      # workflow succeeds, and GitHub Packages has already published. The skip-if-already-published
      # probe runs inside the script, against npm, so a re-drive at the same tag finishes a half-done
      # release instead of colliding on a version that is already there.
      - name: "publish to npm (skipped when NPM_TOKEN is absent)"
        if: ${{ env.NPM_TOKEN != '' }}
        run: bun run scripts/publish-npm.ts
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
