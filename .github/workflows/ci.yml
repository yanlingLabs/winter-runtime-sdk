name: ci
# P7b Task 1 (the spine). Every gate this repository has, on every push and pull request. NOTHING in
# this file publishes anything — `release.yml` is the only workflow that can, and it fires only on a
# `v*` tag or a `workflow_dispatch` (`scripts/release-gates.test.ts` pins that trigger set and
# asserts no other workflow in this repository contains the word `publish`).
#
# ONE CHECKOUT (R6, the close-out collapse). The three `@yanlinglabs/*` devDependencies are registry
# pins resolved by `pnpm install --frozen-lockfile` below; `tsconfig.base.json` carries no `paths`, so
# the typecheck, the build and the smoke all resolve the peer through node_modules like any other
# consumer. See `docs/architecture.md`, "Consuming the Winter SDK", for what this replaced.
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.3.14" }
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - run: pnpm install --frozen-lockfile
      - run: bun run build:packages          # FIRST, and explicitly: two steps below resolve through
                                             # `types`, i.e. `./dist/*.d.ts`. Never a side effect of
                                             # some earlier step.
      - run: bun test                        # the whole suite: the contract re-export gate, the
                                             # version matrix, the door's pass-through, the seams, the
                                             # two harness smokes, AND the two source gates —
                                             # `test/gates/source-hygiene.test.ts` (no raw control
                                             # bytes) and `test/gates/brand-gate.test.ts` (the ported
                                             # brand-literal rules 1-10 plus the brand-less call-site
                                             # allowlist). They are `bun test` files on purpose: a
                                             # gate that needs its own CI step is a gate a developer
                                             # only meets after pushing.
      - run: bun run typecheck               # whole-repo `tsc --noEmit` including test files and
                                             # scripts — `bun test` only type-strips, so this is the
                                             # repository's one real tsc gate, and it is what enforces
                                             # every type-level assertion in the test suite.

  pack-smoke:
    # WS-02 §9 item 3: proves a consumer can INSTALL and IMPORT what `release-pack.ts` packs, under
    # Node 18 AND Bun, both BLOCKING. This job never publishes; it packs into a temp directory outside
    # the repository, installs there, and imports every declared `exports` entry.
    #
    # `scripts/smoke-installed.ts` provides the REQUIRED PEER by an ordinary registry install into the
    # probe directory (R6) — the peer is published, so this is what a real consumer's install looks
    # like; see that script's own header for the version it pins and why.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.3.14" }
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 18 }
      - run: pnpm install --frozen-lockfile
      - name: "smoke (Node 18) — BLOCKING"
        run: bun run scripts/smoke-installed.ts --runtime=node
      - name: "smoke (Bun) — BLOCKING"
        run: bun run scripts/smoke-installed.ts --runtime=bun
